[workspace]
members = [
  "crates/wbgeotiff",
  "crates/wbprojection",
  "crates/wbraster",
  "crates/wbvector",
  "crates/wblidar",
  "crates/wbhdf",
  "crates/wbtopology",
  "crates/wbcore",
  "crates/wblicense_core",
  "crates/wbspatialstats",
  "crates/wbtools_oss",
  "crates/whitebox_hydro_cli",
  "crates/wbtools_pro_shim",
  "crates/wbw_python",
  "crates/wbw_r",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# 发布给 C FFI 调用方的二进制不需要 DWARF 调试信息；保留 .symtab 方便 nm/objdump 排查。
strip = "debuginfo"

[profile.dev]
opt-level = 1

# Faster iterative profile for local Python binding development.
# Use with: maturin develop --profile release-dev
[profile.release-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = 1
